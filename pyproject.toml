[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jevframe"
version = "0.1.0"
description = "Typed semantic decisions for pandas and Polars with TypeSafe Jev"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Konstantin Taletskiy"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = ["typesafe-sdk>=0.7,<0.8", "tqdm>=4.66,<5"]

[project.urls]
Repository = "https://github.com/ktaletsk/jevframe"
Issues = "https://github.com/ktaletsk/jevframe/issues"

[project.optional-dependencies]
pandas = ["pandas>=2.2,<4"]
polars = ["polars>=1,<2"]
examples = ["pandas>=2.2,<4", "marimo>=0.19,<1", "altair>=5,<7"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11", "build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/jevframe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
