[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jevframe"
version = "0.1.0"
description = "Semantic AI classification and scoring for pandas and Polars with TypeSafe Jev"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Konstantin Taletskiy"}]
keywords = [
    "pandas",
    "polars",
    "dataframe",
    "text-classification",
    "sentiment-analysis",
    "data-labeling",
    "structured-output",
    "typesafe-ai",
    "jev",
    "marimo",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = ["typesafe-sdk>=0.7,<0.8", "tqdm>=4.66,<5"]

[project.urls]
Documentation = "https://github.com/ktaletsk/jevframe#readme"
Repository = "https://github.com/ktaletsk/jevframe"
Issues = "https://github.com/ktaletsk/jevframe/issues"
Demo = "https://molab.marimo.io/github/ktaletsk/jevframe/blob/main/examples/reviews.py/server"

[project.optional-dependencies]
pandas = ["pandas>=2.2,<4"]
polars = ["polars>=1,<2"]
examples = ["pandas>=2.2,<4", "marimo>=0.24,<1", "altair>=5,<7", "fsspec[http]>=2025.3"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11", "build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/jevframe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
